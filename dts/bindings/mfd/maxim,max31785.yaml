description: Maxim MAX31785

compatible: "maxim,max31785"

include: smbus-device.yaml

bus: max31785

properties:
  reg:
    required: true

  reset-gpios:
    type: phandle-array
    description: |
      Reset# pin
      This pin is defined if there is a gpio on the microcontroller that needs
      to be controlled to take the device out of reset.

  ctrl-gpios:
    type: phandle-array
    description: |
      Control pin
      This pin is defined if there is a gpio on the microcontroller that needs
      to be controlled to set the device to normal mode.  (Fans not 100%)
