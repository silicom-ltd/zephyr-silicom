description: |

  Microchip XEC RPM2PWM

  Microchip's MEC172x series of embedded controllers supports up to 2 closed loop fan controllers.
  The fan controllers use an input tachometer reading and a target RPM to control the PWM to the
  fans.  There are multiple fan type configurations to support fans with different numbers of poles
  in order to read the RPM correctly, as well as options to control the fan ramp up/down and
  startup spin control.

  This driver is an initial baseline requesting review and comment on the design and feature-set.

  Example DTS board configuration:

  &rpmfan0 {
          pinctrl-0 = <&gpwm0_gpio53 &gtach_gpio050>;
          pinctrl-names = "default";
          status = "okay";

          rpmfantach0: {
                  status = "okay";
          }

          fan {
                  fan0: fan {
                          pwms = <&rpmfan0 0 PWM_MSEC(30) 0>;
                          edges = <5>;
                  };
          };
  };

include: [pwm-controller.yaml, base.yaml, pinctrl-device.yaml]

compatible: "microchip,xec-rpm2pwm"

properties:
  reg:
    required: true

  pcrs:
    type: array
    required: true
    description: RPM2PWM PCR register index and bit position

  "#pwm-cells":
    const: 3

  girqs:
    type: array
    required: true
    description: |
      Array of encoded interrupt information

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  gain:
    type: array
    required: false
    description: |
      Array of proportional/integral/derivative gain for fan speed control.  Values can only be 1,2,4,8.

  der_opts:
    type: string
    required: false
    description: |
      Derivative options: 
      - RPM2PWM_DERIVATIVE_NONE: No derivative option
      - RPM2PWM_DERIVATIVE_BASIC: Basic derivative of error added to PWM drive
      - RPM2PWM_DERIVATIVE_STEP: Derivative is not limited by max step value
      - RPM2PWM_DERIVATIVE_BOTH: Use both Basic and Step derivative, doubling derivative effect
    enum:
      - "RPM2PWM_DERIVATIVE_NONE"
      - "RPM2PWM_DERIVATIVE_BASIC"
      - "RPM2PWM_DERIVATIVE_STEP"
      - "RPM2PWM_DERIVATIVE_BOTH"

  update:
    type: string
    required: false
    description: |
      Update times:
      - RPM2PWM_UPDATE_100MS: 100ms update period
      - RPM2PWM_UPDATE_200MS: 200ms update period
      - RPM2PWM_UPDATE_300MS: 300ms
      - RPM2PWM_UPDATE_400MS: etc
      - RPM2PWM_UPDATE_500MS:
      - RPM2PWM_UPDATE_800MS:
      - RPM2PWM_UPDATE_1200MS:
      - RPM2PWM_UPDATE_1600MS:
    enum:
      - "RPM2PWM_UPDATE_100MS"
      - "RPM2PWM_UPDATE_200MS"
      - "RPM2PWM_UPDATE_300MS"
      - "RPM2PWM_UPDATE_400MS"
      - "RPM2PWM_UPDATE_500MS"
      - "RPM2PWM_UPDATE_800MS"
      - "RPM2PWM_UPDATE_1200MS"
      - "RPM2PWM_UPDATE_1600MS"

  spinup_time:
    type: string
    required: false
    description: |
      Time the spin-up function runs for.
    enum:
      - "RPM2PWM_SPINUP_250MS"
      - "RPM2PWM_SPINUP_500MS"
      - "RPM2PWM_SPINUP_1S"
      - "RPM2PWM_SPINUP_2S"

  spinup_level:
    type: string
    required: false
    description: |
      Drive level used by the spinup routine
    enum:
      - "RPM2PWM_SPINUP_LVL_30%"
      - "RPM2PWM_SPINUP_LVL_35%"
      - "RPM2PWM_SPINUP_LVL_40%"
      - "RPM2PWM_SPINUP_LVL_45%"
      - "RPM2PWM_SPINUP_LVL_50%"
      - "RPM2PWM_SPINUP_LVL_55%"
      - "RPM2PWM_SPINUP_LVL_60%"
      - "RPM2PWM_SPINUP_LVL_65%"

  spinup_nokick:
    type: boolean
    description: |
      If nokick is enabled, the PWM will not be driven to 100% for the spinup time.

  spinup_drive_fail:
    type: string
    description: |
      How many update cycles for drive fail detection.
    enum:
      - "RPM2PWM_SPINUP_DRIVEFAIL_DISABLED"
      - "RPM2PWM_SPINUP_DRIVEFAIL_16"
      - "RPM2PWM_SPINUP_DRIVEFAIL_32"
      - "RPM2PWM_SPINUP_DRIVEFAIL_64"

  enable_ramp_control:
    type: boolean
    description: |
      For manual control of fan speed, enable this. 

  manual_mode:
    type: boolean
    description: |
      Manual (PWM duty cycle) control of the fan IP

child-binding:
  child-binding:
    properties:
      pwms:
        required: true
        type: phandle-array
        description: |
          Reference to RPM2PWM instance.

          The period field is ignored, period is fixed in hardware.  Flags
          should be used to set the desired spin-up and update period etc.
          of the rpm2pwm fan controller.

      edges:
        required: true
        type: int
        description: |
          Number of edges on this fan that are needed to count a single
          revolution.

pwm-cells:
  - channel
  - period
  - flags
