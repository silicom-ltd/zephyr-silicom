description: Microchip EMC230X 1/2/3/5-channel I2C-bus PWM controller

compatible: "microchip,emc230x-pwm"

include: [pwm-controller.yaml, base.yaml]

properties:
  "#pwm-cells":
    const: 2

child-binding:
  properties:
    pwms:
      required: true
      type: phandle-array

    tach:
      required: false
      type: phandle

    edges:
      required: true
      type: int

    initial:
      required: false
      type: int

pwm-cells:
  - channel
  - period
