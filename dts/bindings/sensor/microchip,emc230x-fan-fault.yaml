description: fan fault measurement of Microchip EMC230X PWM Controller

include: [sensor-device.yaml, fan-fault-controller.yaml]

compatible: "microchip,emc230x-fan-fault"

on-bus: emc230x

properties:

  "#fan-fault-cells":
  const: 2

fan-fault-cells:
  - channel
  - flags
