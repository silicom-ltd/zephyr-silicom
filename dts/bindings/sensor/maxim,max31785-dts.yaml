description: Maxim MAX31785 Digital Temperature Sensor

compatible: "maxim,max31785-dts"

on-bus: max31785

child-binding:
  # zephyr,deferred-init: lets the application hold the MAX31785 in reset
  # at boot and initialize these devices later with device_init()
  include:
    - name: base.yaml
      property-allowlist:
        - zephyr,deferred-init

  properties:
    fans:
      type: phandles
      description: |
        List of Fan phandles that this DTS affects.
